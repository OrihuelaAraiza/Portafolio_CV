name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Una serie de commits seguidos cancela las ejecuciones anteriores de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, presupuesto y navegador
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build de producción
        run: npm run build

      - name: Presupuesto de carga inicial
        run: npm run size

      # El navegador pesa ~150 MB: se cachea contra la versión de Playwright
      # declarada en package-lock.json para no descargarlo en cada ejecución.
      - name: Leer versión de Playwright
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restaurar caché del navegador
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Dependencias del sistema para Chromium
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Pruebas de navegador y accesibilidad
        run: npm test

      - name: Guardar rastros de los fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-resultados
          path: test-results/
          retention-days: 7
